# Shogun Showdown port settings. Change a value, save, and start the game again.

# How the picture fits screens narrower than 4:3 (square screens such as 720x720).
#   fill: the 16:9 picture uses the full width; the side panels (button help, info) move in
#         to stay on screen and can cover the outermost tiles.
#   fit:  the picture is shown as on a 4:3 screen, with black bars above and below; the panels
#         sit where they do at 640x480 and cover nothing.
# On 4:3 and wider screens both look the same.
SHOGUN_ASPECT="fill"

# Sharp upscaling: 1 keeps the pixel art evenly sized at any scale, 0 shows the game's own
# point filtered picture (some art pixels wider than others).
SHOGUN_SHARP="1"
